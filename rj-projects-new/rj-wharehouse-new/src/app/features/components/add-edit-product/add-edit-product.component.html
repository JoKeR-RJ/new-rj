<div class="container d-flex justify-content-center mt-4 mb-4">
  <div class="card w-100" style="max-width: 100rem">
    <div class="card-body p-3">
      
      <form [formGroup]="productForm">
        <div class="row">
          <div class="col-6">
            <input type="text" class="form-control" formControlName="name" placeholder="Nome" />
          </div>
          <div class="col-6">
            <textarea type="text" class="form-control" formControlName="description" placeholder="Descrizione"></textarea>
          </div>
        </div>

        <div class="row mt-3">
          <div class="col-6">
            <input type="number" class="form-control" formControlName="quantity" placeholder="Quantità" min="1" />
          </div>
          <div class="col-6">
            <input type="number" class="form-control" formControlName="price" placeholder="Prezzo" min="0" />
          </div>
        </div>

        <div class="row mt-4">
          <div class="col text-center">
            <button class="btn btn-outline-primary w-50" (click)="onSubmit()">{{confirm}}</button>
          </div>
        </div>
        <div class="row mt-4">
          <div class="col text-center">
            <button class="btn btn-outline-secondary w-50" (click)="navigateToShow()">{{goToShow}}</button>
          </div>
        </div>
          
        
      </form>
    </div>
  </div>
</div>
