<div class="container d-flex justify-content-center mt-4 mb-4">
  <div class="card w-100" style="max-width: 100rem">
    <div class="card-body p-3">

      <div class="row mb-3">
        <div class="col text-center">
          <button class="btn btn-outline-primary" (click)="goToDashboard()">Torna alla Dashboard</button>
        </div>
      </div>

      <form [formGroup]="createOrderForm" (ngSubmit)="onSubmit()">
        <div class="row">

          <div class="col-6">
            <select class="form-control" [ngClass]="{'is-invalid': createOrderForm.get('customerId')?.invalid && createOrderForm.get('customerId')?.touched}" formControlName="customerId">
              <option value="" disabled>Seleziona Cliente</option>
              <option *ngFor="let customer of customerList" [ngValue]="customer.id">{{ customer.name }}</option>
            </select>

            <div *ngIf="createOrderForm.get('customerId')?.invalid && createOrderForm.get('customerId')?.touched" class="text-danger">
              <small *ngIf="createOrderForm.get('customerId')?.errors?.required">Il cliente è obbligatorio</small>
            </div>
          </div>


          <div class="col-6">
            <textarea class="form-control" [ngClass]="{'is-invalid': createOrderForm.get('description')?.invalid && createOrderForm.get('description')?.touched}" formControlName="description" placeholder="Descrizione"></textarea>
            <div *ngIf="createOrderForm.get('description')?.invalid && createOrderForm.get('description')?.touched" class="text-danger">
              <small *ngIf="createOrderForm.get('description')?.errors?.required">La descrizione è obbligatoria</small>
              <small *ngIf="createOrderForm.get('description')?.errors?.maxlength">Massimo 50 caratteri</small>
            </div>
          </div>ù
          
        </div>

        <div class="row mt-3">
          <div class="col-6">
            <input type="number" class="form-control" [ngClass]="{'is-invalid': createOrderForm.get('quantity')?.invalid && createOrderForm.get('quantity')?.touched}" formControlName="quantity" placeholder="Quantità" min="1" [max]="maxQuantity" (input)="calculateTotal()" />
            <div *ngIf="createOrderForm.get('quantity')?.invalid && createOrderForm.get('quantity')?.touched" class="text-danger">
              <small *ngIf="createOrderForm.get('quantity')?.errors?.required">La quantità è obbligatoria</small>
              <small *ngIf="createOrderForm.get('quantity')?.errors?.max">Quantità massima: {{ maxQuantity }}</small>
            </div>
          </div>
          <div class="col-6">
            <input class="form-control" formControlName="unitPrice" placeholder="Prezzo" readonly />
          </div>
        </div>



        <div class="row mt-4">
          <div class="col text-center">
            <select class="form-control" [ngClass]="{'is-invalid': createOrderForm.get('productId')?.invalid && createOrderForm.get('productId')?.touched}" formControlName="productId" (change)="onProductChange()">
              <option value="" disabled>Seleziona Prodotto</option>
              <option *ngFor="let product of productList" [ngValue]="product.id">{{ product.name }}</option>
            </select>
            <div *ngIf="createOrderForm.get('productId')?.invalid && createOrderForm.get('productId')?.touched" class="text-danger">
              <small *ngIf="createOrderForm.get('productId')?.errors?.required">Il prodotto è obbligatorio</small>
            </div>
          </div>
        </div>


        <div class="row mt-4">
          <div class="col text-center">
            <input type="number" class="form-control" formControlName="total" placeholder="Totale" readonly />
          </div>
        </div>


        <div class="row mt-4">
          <div class="col text-center">
            <button type="submit" class="btn btn-outline-secondary w-50" [disabled]="createOrderForm.invalid">{{ submitButtonText }}</button>
          </div>
        </div>



      </form>



    </div>
  </div>
</div>
